name: Deploy theme

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; queue the newer one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    # Only the private key is a secret; everything else is a repository/environment variable.
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Check deploy settings
        run: |
          for name in SSH_HOST SSH_USER DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set."
              exit 1
            fi
          done
          # Guard against --delete wiping anything outside the theme folder.
          case "${DEPLOY_PATH%/}" in
            */wp-content/themes/?*) ;;
            *) echo "::error::DEPLOY_PATH must point at .../wp-content/themes/<theme>."; exit 1 ;;
          esac

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # Strip Windows line endings that can sneak in when pasting the key.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::SSH_PRIVATE_KEY is not a valid private key. Paste the whole file, including the BEGIN/END lines."
            exit 1
          fi
          # Public fingerprint only; compare with the key in the server's authorized_keys.
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key)"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS not set; trusting host key from ssh-keyscan."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude-from=.distignore \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes" \
            ./ "$SSH_USER@$SSH_HOST:${DEPLOY_PATH%/}/"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
